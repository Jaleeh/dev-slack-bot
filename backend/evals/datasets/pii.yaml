# Fake personal data for scoring redactors. Every value is invented and drawn from
# ranges reserved for examples; see the step 2 spec, section "2.4 PII set".
version: 1
snippets:
  - id: checkout-blocked
    kind: question
    text: "Why can't John Doe (john.doe@example.com, 07700 900123) check out? The page for order 100042 just keeps loading."
    planted:
      - { type: PERSON, value: "John Doe" }
      - { type: EMAIL, value: "john.doe@example.com" }
      - { type: PHONE, value: "07700 900123" }
    lookalikes: ["100042"]

  - id: refund-call
    kind: question
    text: "Jane Roe rang on 020 7946 0321 asking where the refund for order 100517 is. How long do refunds take to show up?"
    planted:
      - { type: PERSON, value: "Jane Roe" }
      - { type: PHONE, value: "020 7946 0321" }
    lookalikes: ["100517"]

  - id: card-declined
    kind: question
    text: "Marisol Quenby says the card 4111 1111 1111 1111 keeps getting declined, but the bank says it's fine. The parcel is needed by 3 March. What can stop a card going through?"
    planted:
      - { type: PERSON, value: "Marisol Quenby" }
      - { type: CARD, value: "4111 1111 1111 1111" }
    lookalikes: ["3 March"]

  - id: address-change
    kind: question
    text: "Kwame Ashbury-Tetteh has moved to 14 Larkspur Mews, Mirrowfold and wants future orders sent there. The account email is kwame.at@example.org. Can the delivery address be changed for orders already placed?"
    planted:
      - { type: PERSON, value: "Kwame Ashbury-Tetteh" }
      - { type: ADDRESS, value: "14 Larkspur Mews, Mirrowfold" }
      - { type: EMAIL, value: "kwame.at@example.org" }
    lookalikes: []

  - id: age-check
    kind: question
    text: "Siobhan Falloway, date of birth 12/04/1987, can't buy an item marked 18+. The order was tried on 12/09/2026. Why is it blocked?"
