      - { type: IP, value: "203.0.113.42" }
    lookalikes: ["4.2.1"]

  - id: double-charge
    kind: question
    text: "A customer was charged twice on card 5555 5555 5555 4444 for order 100873. Please call back on +44 7700 900456. Why would one order take payment twice?"
    planted:
      - { type: CARD, value: "5555 5555 5555 4444" }
      - { type: PHONE, value: "+44 7700 900456" }
    lookalikes: ["100873"]

  - id: out-of-stock
    kind: question
    text: "Since the 4.2.1 upgrade on 2 October, some products show as out of stock even though the warehouse has them. What decides whether something is in stock?"
    planted: []
    lookalikes: ["4.2.1", "2 October"]

